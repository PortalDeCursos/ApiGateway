server:
  port: 8765

app:
  jwt:
    secret: ${JWT_SECRET:COLOQUE_AQUI_SEU_SEGREDO_JWT-ultra-mega}
    expiration-ms: 86400000

  rotas:
    publicas:
      - metodo: POST
        caminho: /api/usuarios/auth/login
      - metodo: POST
        caminho: /api/usuarios/alunos
      - metodo: GET
        caminho: /api/usuarios/professores/buscar
      - metodo: GET
        caminho: /api/projetos/projetos
      - metodo: GET
        caminho: /api/projetos/projetos/{id}
      - metodo: GET
        caminho: /api/projetos/projetos/em-analise
      - metodo: GET
        caminho: /api/projetos/projetos/aprovados

      # Consultas e downloads de documentos — sem login
      - metodo: GET
        caminho: /api/projetos/projetos/{projetoId}/documentos
      - metodo: GET
        caminho: /api/projetos/projetos/{projetoId}/documentos/{documentoId}/download

    regras:

      - metodo: GET
        caminho: /api/usuarios/alunos/**
        papeis: [ALUNO, PROFESSOR,COORDENADOR ,ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/alunos/{id}
        papeis: [ALUNO, PROFESSOR,COORDENADOR, ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/alunos/{id}
        papeis: [COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/alunos/me
        papeis: [ ALUNO ]

      - metodo: POST
        caminho: /api/usuarios/coordenadores
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/usuarios/coordenadores/**
        papeis: [COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/coordenadores/{id}
        papeis: [COORDENADOR, ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/coordenadores/{id}
        papeis: [ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/coordenadores/me
        papeis: [ COORDENADOR ]

      - metodo: POST
        caminho: /api/usuarios/professores
        papeis: [COORDENADOR, ADMIN ]
      - metodo: GET
        caminho: /api/usuarios/professores/**
        papeis: [PROFESSOR, ADMIN, COORDENADOR, ALUNO]
      - metodo: PUT
        caminho: /api/usuarios/professores/{id}
        papeis: [PROFESSOR,COORDENADOR ,ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/professores/{id}
        papeis: [ADMIN, COORDENADOR]
      - metodo: PUT
        caminho: /api/usuarios/professores/me
        papeis: [ PROFESSOR ]


      - metodo: POST
        caminho: /api/usuarios/admin
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/usuarios/admin/**
        papeis: [ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/admin/{id}
        papeis: [ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/admin/{id}
        papeis: [ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/admin/me
        papeis: [ ADMIN ]


      - metodo: POST
        caminho: /api/academico/campus
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/academico/campus/**
        papeis: [ALUNO, PROFESSOR, COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/academico/campus/{id}
        papeis: [ADMIN]
      - metodo: DELETE
        caminho: /api/academico/campus/{id}
        papeis: [ADMIN]


      - metodo: POST
        caminho: /api/academico/areas-conhecimento
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/academico/areas-conhecimento/**
        papeis: [ALUNO, PROFESSOR, COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/academico/areas-conhecimento/{id}
        papeis: [ADMIN]
      - metodo: DELETE
        caminho: /api/academico/areas-conhecimento/{id}
        papeis: [ADMIN]


      - metodo: POST
        caminho: /api/academico/cursos
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/academico/cursos/**
        papeis: [ALUNO, PROFESSOR, COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/academico/cursos/{id}
        papeis: [ADMIN, COORDENADOR]
      - metodo: PATCH
        caminho: /api/academico/cursos/{id}/coordenador/{coordenadorId}
        papeis: [ ADMIN ]
      - metodo: DELETE
        caminho: /api/academico/cursos/{id}
        papeis: [ADMIN]


      - metodo: POST
        caminho: /api/academico/disciplinas
        papeis: [ADMIN, COORDENADOR]
      - metodo: GET
        caminho: /api/academico/disciplinas/**
        papeis: [ALUNO, PROFESSOR, COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/academico/disciplinas/{id}
        papeis: [ADMIN, COORDENADOR]
      - metodo: DELETE
        caminho: /api/academico/disciplinas/{id}
        papeis: [ADMIN, COORDENADOR]

      # PROJETOS

      # Cadastro de projetos
      - metodo: POST
        caminho: /api/projetos/projetos
        papeis: [ALUNO, PROFESSOR]

      # Atualização de projetos
      - metodo: PUT
        caminho: /api/projetos/projetos/{id}
        papeis: [ALUNO, PROFESSOR]

      # Alteração de status
      - metodo: PATCH
        caminho: /api/projetos/projetos/{id}/status
        papeis: [PROFESSOR, COORDENADOR, ADMIN]

      # Exclusão de projetos
      - metodo: DELETE
        caminho: /api/projetos/projetos/{id}
        papeis: [COORDENADOR, ADMIN]

      # Envio de documentos
      - metodo: POST
        caminho: /api/projetos/projetos/{projetoId}/documentos
        papeis: [ALUNO, PROFESSOR]

      # Exclusão de documentos
      - metodo: DELETE
        caminho: /api/projetos/projetos/{projetoId}/documentos/{documentoId}
        papeis: [COORDENADOR, ADMIN]

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuario
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**
            - id: academico
              uri: http://localhost:8082
              predicates:
                - Path=/api/academico/**
            - id: projetos
              uri: http://localhost:8083
              predicates:
                - Path=/api/projetos/**
