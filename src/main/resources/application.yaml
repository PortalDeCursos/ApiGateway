server:
  port: 8765

app:
  jwt:
    secret: ${JWT_SECRET:14I15oujcYSvV7r7Lghmg+HUMJ5n8YXDYmQoyHFiWMA=}
    expiration-ms: 86400000

  rotas:
    publicas:
      - metodo: POST
        caminho: /api/usuarios/auth/login
      - metodo: POST
        caminho: /api/usuarios/alunos

    regras:

      - metodo: GET
        caminho: /api/usuarios/alunos/**
        papeis: [ALUNO, PROFESSOR,COORDENADOR ,ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/alunos/{id}
        papeis: [ALUNO, PROFESSOR,COORDENADOR, ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/alunos/{id}
        papeis: [COORDENADOR, ADMIN]

      - metodo: POST
        caminho: /api/usuarios/coordenadores
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/usuarios/coordenadores/**
        papeis: [COORDENADOR, ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/coordenadores/{id}
        papeis: [COORDENADOR, ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/coordenadores/{id}
        papeis: [ADMIN]

      - metodo: POST
        caminho: /api/usuarios/professores
        papeis: [COORDENADOR, ADMIN ]
      - metodo: GET
        caminho: /api/usuarios/professores/**
        papeis: [PROFESSOR, ADMIN, COORDENADOR, ALUNO]
      - metodo: PUT
        caminho: /api/usuarios/professores/{id}
        papeis: [PROFESSOR,COORNADOR ,ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/professores/{id}
        papeis: [ADMIN, COORDENADOR]


      - metodo: POST
        caminho: /api/usuarios/admin
        papeis: [ADMIN]
      - metodo: GET
        caminho: /api/usuarios/admin/**
        papeis: [ADMIN]
      - metodo: PUT
        caminho: /api/usuarios/admin/{id}
        papeis: [ADMIN]
      - metodo: DELETE
        caminho: /api/usuarios/admin/{id}
        papeis: [ADMIN]




spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuario
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**

