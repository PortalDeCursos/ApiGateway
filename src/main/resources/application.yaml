server:
  port: 8765

app:
  jwt:
    secret: ${JWT_SECRET:14I15oujcYSvV7r7Lghmg+HUMJ5n8YXDYmQoyHFiWMA=}
    expiration-ms: 86400000

  rotas:
    publicas:
      - metodo: POST
        caminho: /api/usuarios/auth/login
      - metodo: GET
        caminho: /api/usuarios/professores
    regras:
      - metodo: GET
        caminho: /api/usuarios/alunos/**
        papeis: [ALUNO, PROFESSOR, ADMIN]
      - metodo: POST
        caminho: /api/usuarios/alunos/**
        papeis: [ADMIN]
      - metodo: "*"
        caminho: /api/usuarios/admin/**
        papeis: [ADMIN]


spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuario
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**

